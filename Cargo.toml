[package]
name = "tui-do-list"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"   # let-chains
description = "A daily to-do list TUI with bullet-journal style carry-over"
license = "MIT"

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
anyhow = "1"
time = "0.3"   # date type used by ratatui's calendar widget
toml = "1"
toml_edit = "0.23"   # comment-preserving config edits (:newlist)
